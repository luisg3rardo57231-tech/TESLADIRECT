
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Proyecto escolar TeslaDirect">
    <title>TeslaDirect | Proyecto Escolar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
        }

        header {
            background-color: #000;
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #e82127;
            font-size: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #222, #000);
        }

        .hero h2 {
            font-size: 52px;
            margin-bottom: 20px;
        }

        .hero p {
            color: #ccc;
            font-size: 18px;
            max-width: 600px;
            line-height: 1.6;
        }

        .hero button {
            margin-top: 30px;
            padding: 15px 30px;
            background-color: #e82127;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .hero button:hover {
            background-color: #b7191e;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #888;
        }
    </style>
</head>

<body>

    <header>
        <h1>TESLADIRECT</h1>

        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#nosotros">Nosotros</a>
        </nav>
    </header>

    <section class="hero" id="inicio">
        <h2>El futuro es eléctrico.</h2>

        <p>
            Bienvenido a TeslaDirect, un proyecto escolar
            dedicado a explorar la innovación, tecnología
            y movilidad eléctrica del futuro.
        </p>

        <button onclick="mostrarMensaje()">
            Conoce más
        </button>
    </section>

    <footer id="nosotros">
        <p>TESLADIRECT | Proyecto Escolar 2026</p>
    </footer>

    <script>
        function mostrarMensaje() {
            alert("¡Bienvenido a TeslaDirect!");
        }
    </script>

</body>
</html>
